<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EA%3C/text%3E%3C/svg%3E">
  <title>ARW Universal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== 顶部导航 ===== -->
  <header class="nav">
    <div class="nav-inner">
      <h1 class="nav-title">ARW Universal</h1>
      <span class="nav-badge">7.1</span>
    </div>
  </header>

  <main class="container">

    <!-- ===== 模式切换 ===== -->
    <section class="segmented" role="tablist" aria-label="处理模式">
      <button class="seg-btn is-active" data-mode="hires" role="tab">超分辨率 2×</button>
      <button class="seg-btn" data-mode="nr" role="tab">AI 降噪 1×</button>
      <button class="seg-btn" data-mode="convert" role="tab">ARW → DNG</button>
    </section>

    <!-- ===== 文件选择 ===== -->
    <section class="group">
      <div class="drop-card" id="dropCard">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4m0 0l-4 4m4-4l4 4"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        <p class="drop-title">选择 RAW 文件</p>
        <p class="drop-sub">支持 ARW / CR3 / NEF / RAF / RW2 / ORF / DNG</p>
        <input type="file" id="fileInput" class="hidden" multiple accept=".arw,.srf,.sr2,.cr2,.cr3,.nef,.nrw,.raf,.rw2,.orf,.pef,.srw,.dng,.raw">
      </div>
      <ul class="file-list" id="fileList"></ul>
    </section>

    <!-- ===== 参数设置 ===== -->
    <section class="group" id="paramGroup">

      <div class="row" data-param="format">
        <div class="row-label">
          <span class="row-title">输出格式</span>
        </div>
        <div class="row-control segmented-sm">
          <button class="sm-btn is-active" data-value="dng">DNG</button>
          <button class="sm-btn" data-value="tiff">TIFF</button>
          <button class="sm-btn" data-value="jpeg">预览</button>
        </div>
      </div>

      <div class="row" data-param="cas">
        <div class="row-label">
          <span class="row-title">CAS 锐化</span>
          <span class="row-value" id="casValue">0.30</span>
        </div>
        <input type="range" class="slider" id="casSlider" min="0" max="1" step="0.05" value="0.30">
      </div>

      <div class="row" data-param="nr-strength">
        <div class="row-label">
          <span class="row-title">降噪强度</span>
          <span class="row-value" id="nrValue">1.00</span>
        </div>
        <input type="range" class="slider" id="nrSlider" min="0.2" max="2" step="0.1" value="1.0">
      </div>

      <div class="row" data-param="detail">
        <div class="row-label">
          <span class="row-title">细节档位</span>
        </div>
        <div class="stepper">
          <button class="step-btn" id="detailMinus" aria-label="减少">−</button>
          <span class="step-value" id="detailValue">3</span>
          <button class="step-btn" id="detailPlus" aria-label="增加">＋</button>
        </div>
      </div>

      <div class="row" data-param="noise">
        <div class="row-label">
          <span class="row-title">噪声估计</span>
        </div>
        <div class="row-control segmented-sm">
          <button class="sm-btn" data-value="off">关闭</button>
          <button class="sm-btn is-active" data-value="std">标准</button>
          <button class="sm-btn" data-value="strong">较强</button>
        </div>
      </div>

      <div class="row" data-param="precise">
        <div class="row-label">
          <span class="row-title">精确模式</span>
          <span class="row-sub">强制 CPU 推理，关闭加速器回退</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="preciseSwitch">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
    </section>

    <!-- ===== 开始按钮 ===== -->
    <button class="primary-btn" id="startBtn">开始处理</button>

    <!-- ===== 进度与日志 ===== -->
    <section class="group" id="progressGroup" hidden>
      <div class="progress-head">
        <span class="progress-title" id="progressTitle">准备中…</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta" id="progressMeta">—</div>
      <div class="log" id="logBox"></div>
    </section>

    <!-- ===== 结果 ===== -->
    <section class="group" id="resultGroup" hidden>
      <h2 class="group-title">处理结果</h2>
      <ul class="result-list" id="resultList"></ul>
    </section>

    <p class="footnote">本地处理 · 不上传云端</p>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
