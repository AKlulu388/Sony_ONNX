plugins { id 'com.android.application' }

android {
    namespace 'com.sony.sdm'
    compileSdk 34

    defaultConfig {
        applicationId "com.sony.sdm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "7.1"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
}
